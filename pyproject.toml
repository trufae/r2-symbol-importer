[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "r2-symbol-importer"
version = "0.1.0"
description = "AST-based C symbol, struct, function signature, and IOCTL/constant extractor and importer for radare2 and iaito."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Radare2 & iaito Contributors" }]
dependencies = [
    "r2pipe",
    "tree-sitter>=0.22.0",
    "tree-sitter-c>=0.21.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.4.0; python_version>='3.9'",
]
test = [
    "pytest>=7.0.0",
]
all = [
    "r2-symbol-importer[gui,test]",
]

[project.scripts]
r2-symbol-importer = "r2_symbol_importer.r2_plugin:main"
iaito-symbol-importer = "r2_symbol_importer.iaito_plugin:launch"

[tool.setuptools.packages.find]
where = ["."]
include = ["r2_symbol_importer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
